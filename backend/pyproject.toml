[project]
name = "backend"
version = "0.1.0"
description = "Django + DRF + drf-spectacular backend template"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
    "drf-spectacular>=0.28,<1.0",
    "django-cors-headers>=4.7,<5.0",
    "django-environ>=0.12,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "gunicorn>=23.0,<25.0",
    "whitenoise>=6.8,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-django>=4.9,<5.0",
    "ruff>=0.9,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
